# SONE — canonical deployment.
#
# Two containers. No Redis, no Elasticsearch, no object storage required.
# See ADR-0005.
#
#   cp .env.example .env   # then edit SONE_SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up -d
#
# Migrations run automatically on start.

name: sone

services:
  app:
    # Overridable so a locally built image can be used without editing this
    # file: set SONE_IMAGE=sone-local:latest after building on the host.
    #
    # That is the reliable path when Portainer cannot build. BuildKit speaks
    # gRPC over a hijacked connection, and the Portainer Agent — or any reverse
    # proxy in front of the Docker endpoint — answers HTTP/1.1, which fails
    # with "http2: frame too large, note that the frame header looked like an
    # HTTP/1.1 header". Building on the host avoids the problem entirely rather
    # than working around it.
    #
    # :latest, which follows the newest stable release (ADR-0013). It pointed
    # at :main until 0.1.0, because :latest is published only for a
    # non-pre-release tag and a default naming a tag that does not exist gives a
    # 404 on pull — which reads like a broken deployment rather than an
    # unreleased project.
    #
    # Set SONE_IMAGE to a specific version, such as
    # ghcr.io/markusthiel/sone:0.1.0, for an image that will never move
    # under you. :main remains the development stream and changes on every push
    # to main; deploying it means accepting that.
    image: ${SONE_IMAGE:-ghcr.io/markusthiel/sone:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONE_DATABASE_URL: postgres://sone:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/sone
      SONE_SECRET_KEY: ${SONE_SECRET_KEY:?set SONE_SECRET_KEY in .env}
      SONE_PUBLIC_URL: ${SONE_PUBLIC_URL:-http://localhost:3000}
      SONE_STORAGE_BACKEND: ${SONE_STORAGE_BACKEND:-local}
      SONE_STORAGE_PATH: /var/lib/sone/files
      SONE_LOG_LEVEL: ${SONE_LOG_LEVEL:-info}
      SONE_SIGNUP_MODE: ${SONE_SIGNUP_MODE:-invite}
      SONE_MAX_UPLOAD_MB: ${SONE_MAX_UPLOAD_MB:-100}

      # Passed through explicitly, and empty by default.
      #
      # Compose does not forward the host's environment: a variable set in
      # `.env` and not named here never reaches the container. So an operator
      # who filled in SONE_SMTP_PASSWORD — which `.env.example` invites — got a
      # server that never saw it, and mail that failed to authenticate for no
      # visible reason. Fourteen variables were in that state, including both
      # secrets and the six S3 settings — which have since gone, because they
      # configured a backend that was never implemented (ADR-0107).
      #
      # Empty rather than unset, because the server reads an empty SMTP host as
      # "no mail configured", which is the right default.
      SONE_SMTP_HOST: ${SONE_SMTP_HOST:-}
      SONE_SMTP_PORT: ${SONE_SMTP_PORT:-587}
      SONE_SMTP_USER: ${SONE_SMTP_USER:-}
      # Never in the database (ADR-0058): a secret in a table is a secret in
      # every backup.
      SONE_SMTP_PASSWORD: ${SONE_SMTP_PASSWORD:-}
      SONE_SMTP_FROM: ${SONE_SMTP_FROM:-}

      # Reading replies (ADR-0060). Empty host means no replies at all.
      SONE_IMAP_HOST: ${SONE_IMAP_HOST:-}
      SONE_IMAP_PORT: ${SONE_IMAP_PORT:-993}
      SONE_IMAP_USER: ${SONE_IMAP_USER:-}
      SONE_IMAP_PASSWORD: ${SONE_IMAP_PASSWORD:-}
      # The address people reply to; sub-addressing makes it one per
      # notification, so one mailbox serves everything.
      SONE_REPLY_MAILBOX: ${SONE_REPLY_MAILBOX:-}

      # Single sign-on. Env-only for the same reason (ADR-0024).
      SONE_OIDC_CLIENT_SECRET: ${SONE_OIDC_CLIENT_SECRET:-}

      # Object storage, when SONE_STORAGE_BACKEND is s3.

      # How long a deleted workspace can be restored (ADR-0027).
      SONE_WORKSPACE_RETENTION_DAYS: ${SONE_WORKSPACE_RETENTION_DAYS:-30}

      # The numbers read outside config.ts, which nothing forwarded until
      # ADR-0112 — so setting any of them in `.env` did nothing at all, and two
      # of them are documented as settable. Each is refused if it is not a
      # usable number, with a line at startup naming it (ADR-0111).
      SONE_VERSION_RETENTION_DAYS: ${SONE_VERSION_RETENTION_DAYS:-90}
      SONE_VERSION_QUIET_MINUTES: ${SONE_VERSION_QUIET_MINUTES:-10}
      SONE_JOB_RESULT_HOURS: ${SONE_JOB_RESULT_HOURS:-24}
      SONE_EMAIL_DELAY_MINUTES: ${SONE_EMAIL_DELAY_MINUTES:-5}
      SONE_DB_POOL_MAX: ${SONE_DB_POOL_MAX:-10}
      # Named here rather than kept out of reach. The old argument was that a
      # line in compose is an invitation to lower it — but `.env.example` has
      # invited it in a paragraph the whole time, so the effect of leaving it
      # out was an operator who raised it and got nothing. What guards this is
      # the startup warning and the maintenance anomaly (ADR-0010 amendment),
      # not the absence of a line.
      SONE_PASSWORD_COST: ${SONE_PASSWORD_COST:-16}
    volumes:
      - sone_files:/var/lib/sone/files
      # Backups land here. Mount a host path instead if you want them off the
      # Docker volume — a backup on the same disk as the data it protects is
      # only half a backup.
      - sone_backups:/var/lib/sone/backups
    ports:
      - "${SONE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sone
      POSTGRES_USER: sone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Deterministic collation. Fractional indices are compared
      # lexicographically, so a locale-dependent collation would reorder
      # sibling blocks. Do not change this on an existing instance.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - sone_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sone -d sone"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sone_db:
  sone_files:
  sone_backups:
