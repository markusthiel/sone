# Build and publish the container image.
#
# Requires a registered Forgejo Actions runner with an `ubuntu-latest` label and
# access to a Docker daemon. Without one, jobs queue forever and the image has to
# be built by hand — see docs/deployment.md, which does not assume a runner
# exists.
#
# `runs-on` matches a runner LABEL, not a runner name. If this ever queues
# forever on an otherwise healthy runner, the label is the first thing to check.
#
# Deliberately uses no third-party actions. Forgejo resolves bare `uses:`
# references against its own actions mirror, which carries actions/checkout but
# not docker/build-push-action or docker/setup-buildx-action. Referencing those
# by their short name fails at runtime with a confusing "cannot find action"
# rather than at review time. Plain shell `docker build` needs no mirror, works
# on any runner, and is shorter than the action it replaces.
#
# Tags produced:
#   main            every push to main. Development builds; not for production.
#   X.Y.Z and X.Y   a version tag.
#   latest          a version tag that is not a pre-release.
#
# A released tag is never moved (ADR-0013), so `latest` and `main` are the only
# mutable pointers here.

name: Build image

# Manual only, for now.
#
# Publishing an image needs Docker daemon access from inside a job container,
# which this instance's runner does not provide. It ran automatically on version
# tags until v0.1.0-rc.1 showed the problem with that: the tag was perfectly
# good and deployable, and the release still looked broken because a workflow
# beside it was red.
#
# A tag does not need an image. A Portainer repository stack pointed at
# refs/tags/<tag> builds that exact commit (docs/deployment.md), so the image is
# a convenience that trades a build on the deployment host for a pull.
#
# To re-enable: point `runs-on` at a runner with daemon access and add back
#
#   push:
#     tags: ['v*']
#
# The preflight step confirms the daemon in the first seconds, so a wrong runner
# fails immediately and legibly rather than midway through a build.
on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/markusthiel/sone

jobs:
  build:
    # The label of a runner with Docker daemon access. `runs-on` matches a
    # label, not a runner name, and Forgejo does not evaluate expressions here —
    # so pointing this at a different runner is a one-line edit rather than a
    # configuration setting.
    #
    # The preflight step below reports clearly when the chosen runner cannot
    # reach a daemon, which is the failure this workflow keeps hitting.
    runs-on: ubuntu-latest
    # Pinned rather than relying on whatever the runner's label maps to: this
    # job needs a Docker CLI, and the image behind a label is the instance
    # operator's choice, not the project's.
    #
    # The daemon socket is NOT mounted here with `options:`. Forgejo Runner
    # rejects volume mounts unless the operator has whitelisted them in
    # container.valid_volumes, so requiring one would make this workflow depend
    # on runner configuration the project cannot see. Instead it relies on
    # container.docker_host being left at its default, which mounts the daemon
    # socket into the job container automatically. The preflight step below
    # turns a wrong setting into a clear message rather than a cryptic failure
    # eight steps later.
    container:
      image: docker.io/docker:27-cli

    steps:
      - name: Install git
        # docker:27-cli is Alpine-based and ships without git.
        run: apk add --no-cache git

      - name: Preflight — can we reach a Docker daemon?
        run: |
          set -eu
          if docker info >/dev/null 2>&1; then
            echo "Docker daemon reachable."
            exit 0
          fi
          cat <<'MSG' >&2
          No Docker daemon reachable from inside the job container.

          The runner needs to expose one. Either is fine:

            1. Leave container.docker_host at its default ("-") in the runner's
               config.yml, which mounts the host daemon socket into each job
               container automatically. This is the default; an explicit empty
               value disables it.

            2. Whitelist the socket so a workflow may mount it:
                 container:
                   valid_volumes:
                     - /var/run/docker.sock
               and add `options: -v /var/run/docker.sock:/var/run/docker.sock`
               to this job.

          Note that giving a runner the Docker socket is root-equivalent access
          to that daemon. See docs/actions-runner.md before doing it on a host
          that runs anything you care about.

          Nothing is blocked by this failing. A tag is deployable without an
          image: point a Portainer repository stack at refs/tags/<tag> with
          compose path docker-compose.build.yml and it builds that exact commit.
          MSG
          exit 1

      - name: Check out
        run: |
          set -eu
          # Cloning directly rather than using actions/checkout: one less thing
          # that has to resolve through the actions mirror. Full history so
          # `git describe` can find the nearest tag.
          git clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"

      - name: Work out version and tags
        id: meta
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${IMAGE}:${VERSION} ${IMAGE}:$(echo "$VERSION" | cut -d. -f1,2)"
            # `latest` never points at a pre-release.
            case "$VERSION" in
              *-*) : ;;
              *) TAGS="$TAGS ${IMAGE}:latest" ;;
            esac
          else
            # A development build must never look like a release, so it always
            # carries a -dev suffix and the short commit.
            BASE="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo 0.0.0)"
            VERSION="${BASE}-dev.$(git rev-parse --short HEAD)"
            TAGS="${IMAGE}:main"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION as: $TAGS"

      - name: Log in to the registry
        run: |
          set -eu
          # REGISTRY_TOKEN if set, otherwise the token Forgejo injects. The
          # injected one is scoped to this repository's packages, which is
          # exactly what is needed; a personal access token with write:package
          # is the fallback for instances that do not inject one.
          printf '%s' "${REGISTRY_TOKEN:-$GITHUB_TOKEN}" \
            | docker login ghcr.io \
                --username "${GITHUB_ACTOR}" --password-stdin
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          set -eu
          TAG_ARGS=""
          for tag in ${{ steps.meta.outputs.tags }}; do
            TAG_ARGS="$TAG_ARGS --tag $tag"
          done
          # shellcheck disable=SC2086
          docker build \
            --file docker/Dockerfile \
            --build-arg "SONE_VERSION=${{ steps.meta.outputs.version }}" \
            --build-arg "SONE_COMMIT=${GITHUB_SHA}" \
            $TAG_ARGS \
            .

      - name: Push
        run: |
          set -eu
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker push "$tag"
          done

      - name: Report
        run: |
          echo "Published ${{ steps.meta.outputs.tags }}"
          echo "Version reported by /api/version: ${{ steps.meta.outputs.version }}"
