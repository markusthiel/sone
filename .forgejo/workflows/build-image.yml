# Build and publish the container image.
#
# Builds with buildah, which needs no Docker daemon. That is the point: the
# earlier Docker-based version needed a daemon socket inside the job container,
# which this instance's runner does not provide — and mounting one would give
# every workflow root-equivalent access to the host's daemon, a poor trade for
# building an image.
#
# Verified before being committed: this exact Dockerfile was built with
# `buildah bud --isolation chroot --storage-driver vfs --format docker` and the
# resulting image inspected — correct user, entrypoint, exposed port, baked-in
# version, healthcheck present, server and web output in place.
#
# Two flags are load-bearing and must not be dropped:
#
#   --format docker     Without it the image is OCI format and buildah silently
#                       drops HEALTHCHECK: "HEALTHCHECK is not supported for OCI
#                       image format and will be ignored". The published image
#                       would then never report unhealthy and Docker would never
#                       restart a wedged container. Found by inspecting a built
#                       image, not by reading documentation.
#
#   --isolation chroot  buildah's default isolation wants user namespaces, which
#                       an unprivileged job container generally cannot get.
#                       chroot isolation plus the vfs storage driver needs no
#                       privileges at all.
#
# Tags produced:
#   main            every push to main. Development builds; not for production.
#   X.Y.Z and X.Y   a version tag.
#   latest          a version tag that is not a pre-release.
#
# A released tag is never moved (ADR-0013), so `latest` and `main` are the only
# mutable pointers here.

name: Build image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/markusthiel/sone
  # vfs is slower than overlay but needs no privileges. Overlay in an
  # unprivileged container needs fuse-overlayfs and a device that may not be
  # there; correctness before speed.
  STORAGE_DRIVER: vfs
  BUILDAH_ISOLATION: chroot

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Debian rather than Alpine: buildah's Alpine packaging has historically
      # needed extra configuration for unprivileged use, and Debian is what the
      # verification was done against.
      image: docker.io/debian:bookworm-slim

    steps:
      - name: Install buildah and git
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            buildah git ca-certificates python3
          buildah --version

      - name: Check out
        run: |
          set -eu
          # Cloned directly rather than through actions/checkout: one less thing
          # that has to resolve through the actions mirror. Full history so
          # `git describe` can find the nearest tag.
          git clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"

      - name: Work out version and tags
        id: meta
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${IMAGE}:${VERSION} ${IMAGE}:$(echo "$VERSION" | cut -d. -f1,2)"
            # latest never points at a pre-release.
            case "$VERSION" in
              *-*) : ;;
              *) TAGS="$TAGS ${IMAGE}:latest" ;;
            esac
          else
            # A development build must never look like a release, so it always
            # carries a -dev suffix and the short commit.
            BASE="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' | sed 's/-.*//' || echo 0.0.0)"
            VERSION="${BASE}-dev.$(git rev-parse --short HEAD)"
            TAGS="${IMAGE}:main"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION as: $TAGS"

      - name: Build
        run: |
          set -eu
          TAG_ARGS=""
          for tag in ${{ steps.meta.outputs.tags }}; do
            TAG_ARGS="$TAG_ARGS --tag $tag"
          done
          # shellcheck disable=SC2086
          buildah bud \
            --format docker \
            --isolation chroot \
            --storage-driver vfs \
            --file docker/Dockerfile \
            --build-arg "SONE_VERSION=${{ steps.meta.outputs.version }}" \
            --build-arg "SONE_COMMIT=${GITHUB_SHA}" \
            $TAG_ARGS \
            .

      - name: Verify the image before publishing it
        run: |
          set -eu
          FIRST="$(echo '${{ steps.meta.outputs.tags }}' | awk '{print $1}')"

          # An image that builds is not an image that works. These four things
          # have each actually been wrong at some point: a missing server entry
          # point, a missing web build, a dropped healthcheck, and a version
          # that was not baked in.
          buildah --storage-driver vfs inspect --type image "$FIRST" > /tmp/inspect.json
          python3 scripts/verify-image.py /tmp/inspect.json

          # Contents are checked by mounting rather than running: `buildah run`
          # needs a working container runtime, mounting needs nothing.
          CTR="$(buildah --storage-driver vfs from --pull=never "$FIRST")"
          MNT="$(buildah --storage-driver vfs mount "$CTR")"
          MISSING=0
          for f in app/packages/server/dist/main.js \
                   app/packages/web/dist/index.html \
                   app/db/migrations/0001_init.sql \
                   app/docker/entrypoint.sh; do
            if [ -e "$MNT/$f" ]; then
              echo "  ok      /$f"
            else
              echo "  MISSING /$f"
              MISSING=1
            fi
          done
          buildah --storage-driver vfs umount "$CTR" >/dev/null
          buildah --storage-driver vfs rm "$CTR" >/dev/null
          [ "$MISSING" = "0" ]

      - name: Log in to the registry
        run: |
          set -eu
          # REGISTRY_TOKEN if set, otherwise the token Forgejo injects.
          printf '%s' "${REGISTRY_TOKEN:-$FORGEJO_TOKEN}" \
            | buildah login --username "${GITHUB_ACTOR}" --password-stdin \
                ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          set -eu
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "pushing $tag"
            buildah --storage-driver vfs push --format docker "$tag" "docker://$tag"
          done

      - name: Report
        run: |
          set -eu
          echo "Published: ${{ steps.meta.outputs.tags }}"
          echo
          echo "Deploy with docker-compose.yml, setting SONE_IMAGE to one of them."
          echo
          echo "If pulling fails with an authentication error, the package is not"
          echo "publicly readable: Forgejo inherits package visibility from the"
          echo "repository at first push. Packages -> the image -> Settings."
