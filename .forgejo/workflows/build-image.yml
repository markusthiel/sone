# Build and publish the container image.
#
# Modelled on thiel/signagetools, which builds correctly on this instance. Three
# things in that repo corrected assumptions I had made and got wrong:
#
#   1. No `container:` on the job. Setting one is what broke every earlier
#      attempt here: the runner's default job image has Docker available, and
#      overriding it with a container of my own choosing removed the daemon.
#      The preflight step honestly reported "no daemon reachable" — and the
#      cause was my own configuration, not the runner's.
#
#   2. The docker/* actions do resolve on this instance. I had avoided them on
#      the theory that Forgejo's actions mirror does not carry them. It does.
#
#   3. The automatic Actions token has no package write permission, so a push
#      fails with "401 reqPackageAccess". A repository secret REGISTRY_TOKEN
#      holding a Forgejo token with write:package is required. There is
#      deliberately no fallback: falling back to a token that cannot push turns
#      a missing-secret problem into a confusing authorisation error.
#
# What this adds over the reference workflow: the image is verified before it is
# published, rather than pushed and trusted.
#
# Tags produced:
#   main            every push to main. Development builds; not for production.
#   X.Y.Z and X.Y   a version tag.
#   latest          a version tag that is not a pre-release.
#
# A released tag is never moved (ADR-0013), so `latest` and `main` are the only
# mutable pointers here.

name: Build image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest

    # See the note in test.yml. A cold build with no layer cache is the slow
    # case here, which is why this is longer than the test job's ceiling.
    timeout-minutes: 25
    # Deliberately no `container:` — see note 1 above.

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git describe` can find the nearest tag.
          fetch-depth: 0

      - name: Require the registry token
        run: |
          set -eu
          if [ -z "${REGISTRY_TOKEN}" ]; then
            cat <<'MSG' >&2
          REGISTRY_TOKEN is not set.

          The automatic Actions token cannot write packages; pushing with it
          fails with "401 reqPackageAccess". Create a Forgejo token with scope
          write:package (and read:package) and store it as a repository secret
          named REGISTRY_TOKEN.

          Nothing else is blocked by this. A tag is deployable without an image:
          point a Portainer repository stack at refs/tags/<tag> with compose
          path docker-compose.build.yml.
          MSG
            exit 1
          fi
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Work out version and tags
        id: meta
        run: |
          set -eu
          IMAGE="forgejo.thiel.tools/${GITHUB_REPOSITORY}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${IMAGE}:${VERSION} ${IMAGE}:$(echo "$VERSION" | cut -d. -f1,2)"
            # latest never points at a pre-release.
            case "$VERSION" in
              *-*) : ;;
              *) TAGS="$TAGS ${IMAGE}:latest" ;;
            esac
          else
            # git describe output, e.g. 0.1.0-rc.1-7-g8ff137f: the last tag,
            # how many commits since, and the commit.
            #
            # NOT "<base>-dev.<commit>", which is what this used to produce and
            # which broke a running instance. The version fence refuses a
            # downgrade, and pre-release identifiers compare as strings — so
            # "0.1.0-dev.abc" sorts BEFORE "0.1.0-rc.1". Every build of main
            # after tagging a release candidate therefore looked like a
            # downgrade, and the server refused to start. Nothing answered, not
            # even /api/version, so the symptom was a blank page with no way to
            # tell why.
            #
            # describe output sorts after the tag it follows, which is both
            # correct and readable: "7 commits after rc.1".
            DESCRIBED="$(git describe --tags --always 2>/dev/null | sed 's/^v//')"
            case "$DESCRIBED" in
              # No tags in the repository yet: describe returns a bare commit,
              # which is not a version.
              *.*) VERSION="$DESCRIBED" ;;
              *)   VERSION="0.0.0-dev.${DESCRIBED}" ;;
            esac
            TAGS="${IMAGE}:main"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          # build-push-action wants newline-separated tags.
          {
            echo 'tags_multiline<<EOF'
            for t in $TAGS; do echo "$t"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Building $VERSION as: $TAGS"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Loaded into the local daemon rather than pushed, so the image can be
          # inspected before anyone can pull it. Pushing first and checking
          # afterwards would mean a bad image is briefly the published one — and
          # for a version tag, permanently, since a released tag is not moved.
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags_multiline }}
          build-args: |
            SONE_VERSION=${{ steps.meta.outputs.version }}
            SONE_COMMIT=${{ github.sha }}
          # No cache backend configured on purpose. `type=gha` needs the GitHub
          # Actions cache service, which a Forgejo instance does not necessarily
          # provide, and a cache that fails to resolve fails the build. The
          # reference workflow this is modelled on uses none either. Revisit
          # with `type=registry` once the image is publishing reliably.

      - name: Verify the image before publishing it
        run: |
          set -eu
          FIRST="$(echo '${{ steps.meta.outputs.tags }}' | awk '{print $1}')"

          # An image that builds is not an image that works. Each of these has
          # actually been wrong at some point in this project: a missing server
          # entry point, a missing web build, a dropped healthcheck, and a
          # version that was not baked in.
          docker inspect "$FIRST" > /tmp/inspect.json
          python3 scripts/verify-image.py /tmp/inspect.json

          # The image declares no USER, because the entrypoint needs root long
          # enough to make a bind-mounted directory writable and then drops to
          # uid 10001. A static check cannot tell whether that handover actually
          # happens, so this runs the real entrypoint and asks the server
          # process who it is.
          #
          # This is stricter than the check it replaced: an image can declare a
          # non-root USER and still be started as root, and a correct USER line
          # says nothing about what the entrypoint does afterwards.
          echo
          echo "privilege drop:"
          uid="$(docker run --rm --entrypoint /bin/sh "$FIRST" -c '
            set -eu
            command -v su-exec >/dev/null || { echo "su-exec missing" >&2; exit 1; }
            # What the entrypoint does on its last line, asked directly.
            su-exec 10001:10001 id -u
          ')"
          if [ "$uid" != "10001" ]; then
            echo "  the server would run as uid $uid, expected 10001" >&2
            exit 1
          fi
          echo "  server runs as uid $uid"

          echo
          echo "contents:"
          docker run --rm --entrypoint /bin/sh "$FIRST" -c '
            set -e
            for f in packages/server/dist/main.js \
                     packages/web/dist/index.html \
                     db/migrations/0001_init.sql \
                     docker/entrypoint.sh; do
              if [ -e "$f" ]; then echo "  ok      $f"; else echo "  MISSING $f"; exit 1; fi
            done
            # pg_dump is what the backup command shells out to, and it must be
            # new enough for the server it dumps.
            printf "  %s\n" "$(pg_dump --version)"
            printf "  node %s\n" "$(node --version)"
          '

      # Login and push, with retries, because the registry is the same machine
      # as the forge and the runner.
      #
      # On a self-hosted setup these are not independent services: when the
      # forge is briefly unwell — and it does answer 503 under load — the
      # registry is unwell at the same moment, and a build that took two minutes
      # is thrown away for a hiccup that lasted five seconds. This is the one
      # place in the pipeline where retrying is clearly right: the image is
      # already built and verified, and pushing it twice is harmless.
      #
      # The step also reports what the registry actually said. A bare "login
      # failed" sent me looking at the token, which was fine; "the registry
      # answered 503" would have said where to look.
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          registry=forgejo.thiel.tools

          # Reported before attempting anything, so the log distinguishes "the
          # registry is down" from "these credentials are wrong". 401 here is
          # the healthy answer: the endpoint exists and wants authentication.
          code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://$registry/v2/" || echo "no-response")
          echo "registry /v2/ answered: $code (401 is expected and healthy)"

          for attempt in 1 2 3 4 5; do
            if printf '%s' "$REGISTRY_TOKEN" \
                 | docker login "$registry" --username thiel --password-stdin; then
              echo "logged in on attempt $attempt"
              exit 0
            fi
            echo "login attempt $attempt failed; retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done

          echo "Could not log in to $registry after five attempts." >&2
          echo "If the probe above reported 5xx, the forge was unwell rather" >&2
          echo "than the credentials being wrong — re-run this workflow." >&2
          echo "If it reported 401 and login still fails, REGISTRY_TOKEN needs" >&2
          echo "scope write:package and read:package." >&2
          exit 1

      - name: Push
        run: |
          set -eu
          for tag in ${{ steps.meta.outputs.tags }}; do
            pushed=""
            for attempt in 1 2 3; do
              echo "pushing $tag (attempt $attempt)"
              if docker push "$tag"; then
                pushed="yes"
                break
              fi
              echo "push failed; retrying in $((attempt * 15))s" >&2
              sleep $((attempt * 15))
            done
            if [ -z "$pushed" ]; then
              echo "Could not push $tag after three attempts." >&2
              exit 1
            fi
          done

      - name: Report
        run: |
          set -eu
          echo "Published: ${{ steps.meta.outputs.tags }}"
          echo
          echo "Deploy with docker-compose.yml, setting SONE_IMAGE to one of them."
          echo
          echo "If pulling fails with an authentication error, the package is not"
          echo "publicly readable: Forgejo inherits package visibility from the"
          echo "repository at first push. Packages -> the image -> Settings."
