<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No user-scalable=no: disabling zoom breaks the app for anyone who
         needs it, and it is not ours to take away. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SONE</title>

    <!--
      The mark, at three sizes for three consumers. An SVG for the tab, because
      it stays sharp at whatever the browser asks for; a PNG for iOS, which
      ignores SVG and rounds the corners itself; and two for an installed icon.

      theme-color is given per scheme rather than once: a single value paints
      the address bar the wrong colour in one of the two themes, and the phone
      is where anybody notices.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The .ico is not legacy politeness: a bookmark bar, a Windows shortcut
         and every feed reader written before 2020 ask for /favicon.ico by path
         whether it is declared or not, and a 404 there is a blank page icon. It
         carries 16, 32 and 48 — the small two three-barred, the 48 four. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />

    <!--
      What a pasted link looks like.

      A SONE instance is behind a login, so a crawler sees this shell and
      nothing else — which is the point: the card describes the software, never
      the page. A link to somebody's notes pasted into a chat must not preview
      their title. og:url is deliberately absent for the same reason; the
      instance's own address is not ours to write here.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SONE" />
    <meta property="og:title" content="SONE" />
    <meta
      property="og:description"
      content="Wissen strukturieren. Auf deinem Server."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SONE — Wissen strukturieren. Auf deinem Server." />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      The two faces, asked for before the stylesheet is parsed.

      Same origin, so this costs one connection that is already open and no DNS
      lookup to anybody. Only the two Latin files: latin-ext is real but rarer,
      and preloading a file most pages never draw from would spend the budget on
      the wrong one. `crossorigin` is required even same-origin — a font is
      fetched in CORS mode, and a preload without it downloads the file twice.
    -->
    <link
      rel="preload"
      href="/fonts/archivo-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      /*
       * Last-resort error reporting, before any application code runs.
       *
       * React's error boundary catches render-time throws. It cannot catch a
       * module that fails to evaluate, a syntax error in the bundle, a chunk
       * that 404s, or a rejected promise — and in all of those cases React
       * never mounts, so the page is simply white with nothing to report.
       *
       * That happened, twice, and the second time cost a deployment cycle to
       * work out that the browser was running a cached bundle. A white page is
       * the worst possible failure: it is indistinguishable from a network
       * problem, a bad deploy, or data loss.
       *
       * Deliberately inline and dependency-free: this has to work when the
       * bundle is exactly what is broken.
       */
      (function () {
        var reported = false;

        function show(title, detail) {
          if (reported) return;
          reported = true;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '';

          var wrap = document.createElement('div');
          wrap.style.cssText =
            'max-width:40rem;margin:0 auto;padding:24px 20px;' +
            'font:15px/1.55 -apple-system,BlinkMacSystemFont,system-ui,sans-serif';

          var h = document.createElement('h2');
          h.textContent = title;
          h.style.marginTop = '0';

          var p = document.createElement('p');
          p.style.color = '#6b6b66';
          p.textContent =
            'SONE could not start. Your pages are stored on the server and are ' +
            'not affected by this. If a new version was just deployed, the ' +
            'browser may be holding an old cached copy — a hard reload usually ' +
            'fixes that.';

          var btn = document.createElement('button');
          btn.textContent = 'Reload';
          btn.style.cssText =
            'min-height:44px;padding:0 14px;border:1px solid #3e63dd;' +
            'border-radius:6px;background:#3e63dd;color:#fff;cursor:pointer';
          btn.onclick = function () {
            window.location.reload();
          };

          var pre = document.createElement('pre');
          pre.textContent = detail;
          pre.style.cssText =
            'margin-top:16px;padding:10px 12px;border-radius:6px;' +
            'background:#f8f8f7;font-family:ui-monospace,Menlo,monospace;' +
            'font-size:12px;white-space:pre-wrap;word-break:break-word;' +
            'max-height:40vh;overflow:auto';

          wrap.appendChild(h);
          wrap.appendChild(p);
          wrap.appendChild(btn);
          wrap.appendChild(pre);
          root.appendChild(wrap);
        }

        window.addEventListener('error', function (event) {
          /*
           * Only a failure to *start* counts.
           *
           * This handler used to fire for any resource error, including an
           * image inside a document — so one picture that failed to load
           * replaced the entire application with "SONE failed to start". A
           * shared page containing an image did that every time.
           *
           * Two limits now. First: once anything has rendered, the app is
           * running and a later error is its own problem, not a boot failure —
           * React and the code have their own handling, and blanking the screen
           * loses whatever was on it. Second: among resource errors, only the
           * ones that can actually prevent a start — scripts and stylesheets.
           * An image, a video or a font cannot.
           */
          if (root.firstChild) return;

          var target = event.target;
          if (target && target !== window && !event.error) {
            var tag = (target.tagName || '').toLowerCase();
            if (tag !== 'script' && tag !== 'link') return;
          }

          var detail = event.error
            ? event.error.stack || String(event.error)
            : 'Failed to load: ' +
              ((target && (target.src || target.href)) || event.message);
          show('SONE failed to start', detail);
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          // Same reasoning: a rejected promise after the app is up is not a
          // failure to start. A failed save must not blank the page.
          if (root.firstChild) return;

          var reason = event.reason;
          show(
            'SONE failed to start',
            (reason && (reason.stack || reason.message)) || String(reason),
          );
        });

        /*
         * Watchdog: if nothing has rendered after a few seconds and no error
         * fired either, say so. Silence is the case that leaves someone with
         * nothing at all — and "nothing rendered and nothing threw" is itself
         * a useful thing to be told, because it points at the network rather
         * than at the code.
         */
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.childElementCount === 0) {
              show(
                'SONE did not start',
                'The page loaded but nothing rendered, and no error was raised.\n\n' +
                  'Most likely the application bundle did not load. Check the\n' +
                  'browser console and the network tab for a failed request.',
              );
            }
          }, 8000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
